name: Deploy to Cloudflare

# Every push to main builds the site with OpenNext and deploys it to Cloudflare Workers.
# One-time setup (repo → Settings → Secrets and variables → Actions → New repository secret):
#   CLOUDFLARE_API_TOKEN   – token from dash.cloudflare.com/profile/api-tokens ("Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID  – shown on the Workers & Pages overview page
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and deploy
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
